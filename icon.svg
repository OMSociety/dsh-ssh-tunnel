<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ssh_v2_3_host" x1="18" y1="6" x2="18" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4E6EF2"/>
      <stop offset="1" stop-color="#1434B8"/>
    </linearGradient>
    <linearGradient id="ssh_v2_3_flow" x1="14" y1="18" x2="22" y2="18" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#38E298"/>
    </linearGradient>
  </defs>
  <!-- 左服务器节点 -->
  <rect x="7" y="10" width="7" height="16" rx="2" fill="url(#ssh_v2_3_host)"/>
  <circle cx="10.5" cy="14" r="1" fill="#5CE1E6"/>
  <circle cx="10.5" cy="18" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- 右服务器节点 -->
  <rect x="22" y="10" width="7" height="16" rx="2" fill="url(#ssh_v2_3_host)"/>
  <circle cx="25.5" cy="14" r="1" fill="#5CE1E6"/>
  <circle cx="25.5" cy="18" r="1" fill="#FFFFFF" fill-opacity="0.8"/>
  <!-- 中间立体光纤加密管道连线 -->
  <path d="M14 15.5H22" stroke="url(#ssh_v2_3_flow)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M14 20.5H22" stroke="url(#ssh_v2_3_flow)" stroke-width="2.2" stroke-linecap="round"/>
  <!-- 脉冲节点 -->
  <circle cx="18" cy="15.5" r="1.3" fill="#FFFFFF"/>
  <circle cx="18" cy="20.5" r="1.3" fill="#FFFFFF"/>
</svg>
