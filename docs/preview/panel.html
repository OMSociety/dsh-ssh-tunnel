		function TunnelRoot(props) {
			const ctx = props.ctx;
			// Re-render on DSH locale switches: the dictionaries live in ctx.locale
			// and the active language is read through a live subscription.
			const localeKey = React.useSyncExternalStore(
				React.useCallback(function (cb) {
					if (!ctx.locale || typeof ctx.locale.subscribe !== "function") return function () {};

				React.useCallback(function () {

		}

		const inject = ["locale", "slots"];
		function apply(ctx) {

				ctx.effect(function () {
					const offZh = ctx.locale.register(LOCALE_NS, "zh", zh);
					const offEn = ctx.locale.register(LOCALE_NS, "en", en);
					return function () {
						try { offZh(); } catch (e) {}
						try { offEn(); } catch (e) {}

			}
			// Tab chip content: icon + label. Without this seat the chip is text only.
			// The host mounts this into the chip's own flex row (`.tabTitle` is
			// `display: contents`), so the wrapper centres the icon itself; an inline
			// wrapper would leave the svg on the text baseline.
			function TunnelTitle(props) {
				return React.createElement("span", {
					style: { display: "inline-flex", alignItems: "center", gap: "5px" },

			}

			// Official right sidebar: the tab type plus the two pane seats. Absent
			// sidebar services mean the plugin stays silent instead of failing.
			ctx.inject(["sidebarRightTabs", "sidebarRight"], function (injected) {
				const tabs = pick(injected, "sidebarRightTabs");
				if (!tabs || typeof tabs.register !== "function") return;
				const sidebarRight = pick(injected, "sidebarRight");
				const disposers = [];
				disposers.push(tabs.register({
					id: TAB_ID,
					kind: TAB_KIND,
					priority: "extension",
					title: function () { return t("tabTitle"); },
					guide: [{
						id: "main",
						order: 44,
						title: function () { return t("tabTitle"); },
						description: function () { return t("guideDesc"); },
						icon: function (p) { return icon((p && p.size) || 16); },
					}],
				}));
				const slots = ctx.slots;
				if (slots && typeof slots.inject === "function") {
					disposers.push(slots.inject("sidebar.right.pane.tab", function () {
						return slots.register({ name: "sidebar.right.pane.tab", key: TAB_ID }, TunnelBody);
					}));
					disposers.push(slots.inject("sidebar.right.pane.tab.title", function () {
						return slots.register({ name: "sidebar.right.pane.tab.title", key: TAB_ID }, TunnelTitle);
					}));
				}
				if (sidebarRight && typeof sidebarRight.openTab === "function") {
					openOfficial = function () { sidebarRight.openTab(TAB_KIND); };
				}
				return function () {
					for (var i = disposers.length - 1; i >= 0; i--) { try { disposers[i](); } catch (e) {} }
					openOfficial = null;
				};

		}
		exports.apply = apply;
		exports.inject = inject;
		return module.exports;
	},
});
